[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scir-bootstrap"
version = "0.0.0"
description = "Package boundary and validation helpers for the SCIR repository."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scir*", "_internal*", "benchmarks*", "runtime*", "validators*"]
namespaces = true
