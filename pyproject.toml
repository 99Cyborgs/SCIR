[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scir-bootstrap"
version = "0.0.0"
description = "Executable validation and bootstrap helpers for SCIR."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "runtime*", "scir*", "validators*"]
namespaces = true
